# Publish a GitHub release when a `v*` tag is pushed.
#
# This is the project's only workflow: there is no build/PR CI (pre-commit runs the
# same gates locally). The gates here are the Justfile recipes, run inside the Nix
# dev shell — exactly what a developer runs, no second definition of the toolchain.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve the version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"

      - name: Quality gates
        run: nix develop --command just ci

      - name: Build the release binaries
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command just build-linux "$VERSION"
          nix develop --command just build-windows "$VERSION"

      - name: Stage the artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mv dist/dsa-save-editor     "release/dsa-save-editor-$VERSION-linux-amd64"
          mv dist/dsa-save-editor.exe "release/dsa-save-editor-$VERSION-windows-amd64.exe"
          cd release
          sha256sum dsa-save-editor-* >SHA256SUMS
          cat SHA256SUMS

      # The changelog is generated by `just changelog` and committed before the tag,
      # so the notes are the reviewed text — not something regenerated here.
      - name: Extract the release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]( |$)" { found = 1; next }
            found && /^## \[/            { exit }
            found && /^<!--/             { exit }
            found                        { print }
          ' CHANGELOG.md >notes.md
          # Trim the leading and trailing blank lines.
          notes="$(sed -e '/./,$!d' notes.md | tac | sed -e '/./,$!d' | tac)"
          if [ -z "$notes" ]; then
            echo "::error::no '## [$VERSION]' section in CHANGELOG.md — run 'just changelog' and commit it before tagging"
            exit 1
          fi
          printf '%s\n' "$notes" >notes.md
          cat notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag carrying a pre-release suffix (v0.18.0-rc1) is marked as such.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${prerelease[@]}" \
            release/dsa-save-editor-* \
            release/SHA256SUMS
