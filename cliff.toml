# git-cliff configuration — CHANGELOG generated from Conventional Commits.
# Regenerate with `just changelog` (review the diff). Groups match the commit
# types used in this repo (see PROCEDURE_PLANS.md).

[changelog]
header = """
# Changelog

All notable changes to the DragonSword Awakening save editor. Format inspired by
[Keep a Changelog], versions follow [SemVer]. Generated from Conventional Commits
by git-cliff.

[Keep a Changelog]: https://keepachangelog.com/en/1.1.0/
[SemVer]: https://semver.org/

"""

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Keep only commits that match a parser (protects the changelog from noise).
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^build", group = "<!-- 6 -->Build & tooling" },
  { message = "^ci", group = "<!-- 7 -->Continuous integration" },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
  { message = "^merge", skip = true },
  { message = ".*", skip = true },
]
