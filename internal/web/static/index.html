<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DragonSword — Éditeur de sauvegarde</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Bar 1: identity & actions ──────────────────────────────────────────── -->
<header class="topbar">
  <span class="brand">DragonSword</span>
  <span class="spacer"></span>
  <code id="path" class="path" title="fichier de sauvegarde"></code>
  <div class="lang" id="lang" title="langue des noms d'objets">
    <button data-lang="fr">FR</button><button data-lang="en">EN</button>
  </div>
  <span id="modif-badge" class="badge hidden">0 modif.</span>
  <button id="save-btn" class="cta hidden">Écrire dans la save</button>
</header>

<!-- ── Bar 2: navigation (own line, scrollable) ───────────────────────────── -->
<nav class="tabs" id="tabs">
  <button class="tab active" data-view="home">Accueil</button>
  <button class="tab needs-save" data-view="money">Monnaies</button>
  <button class="tab needs-save" data-view="inv">Inventaire</button>
  <button class="tab needs-save" data-view="chars">Personnages</button>
  <button class="tab needs-save" data-view="team">Équipe</button>
  <button class="tab needs-save" data-view="equip">Équipement</button>
  <button class="tab needs-save" data-view="gems">Gemmes</button>
  <button class="tab needs-save" data-view="cook">Cuisine</button>
  <button class="tab needs-save" data-view="sql">SQL brut</button>
</nav>

<!-- ── Screens ────────────────────────────────────────────────────────────── -->
<main class="stage">
  <section id="screen-home"  class="screen"></section>
  <section id="screen-money" class="screen hidden"></section>
  <section id="screen-inv"   class="screen hidden"></section>
  <section id="screen-chars" class="screen hidden"></section>
  <section id="screen-team"  class="screen hidden"></section>
  <section id="screen-equip" class="screen hidden"></section>
  <section id="screen-gems"  class="screen hidden"></section>
  <section id="screen-cook"  class="screen hidden"></section>

  <section id="screen-sql" class="screen hidden sql">
    <aside class="sql-rail">
      <input id="filter" type="search" placeholder="Filtrer les tables…" autocomplete="off">
      <ul id="tables"></ul>
    </aside>
    <div class="sql-content">
      <div class="sql-head">
        <h2 id="table-name">Choisis une table</h2>
        <div id="pager" class="pager hidden">
          <button id="prev">‹ Préc.</button>
          <span id="range"></span>
          <button id="next">Suiv. ›</button>
        </div>
      </div>
      <div id="grid-wrap"><table id="grid"></table></div>
      <p id="hint" class="hint">Vue brute des tables. Double-clic pour éditer une cellule non-clé, puis <b>Écrire dans la save</b>. Un backup horodaté est créé automatiquement. Ferme le jeu avant d'écrire.</p>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
