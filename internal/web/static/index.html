<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DragonSword Awakening — Save Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">⚔</span>
    <div>
      <h1>DragonSword Awakening</h1>
      <p class="sub">Save Editor</p>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="editor">Editor</button>
    <button class="tab" data-view="database">Database <span class="adv">advanced</span></button>
  </nav>
  <div class="save-area">
    <div class="lang" id="lang" title="item name language">
      <button data-lang="fr">FR</button><button data-lang="en">EN</button>
    </div>
    <code id="path" title="save file"></code>
    <button id="save-btn">Write to save file</button>
    <span id="save-status" class="status"></span>
  </div>
</header>

<!-- ── Editor (friendly, game-oriented) ─────────────────────────────────── -->
<main id="view-editor" class="view">
  <aside class="editor-nav">
    <button class="section-link active" data-section="currency">Currency</button>
    <button class="section-link" data-section="consumables">Consumables</button>
    <button class="section-link" data-section="characters">Characters</button>
    <button class="section-link" data-section="team">Team</button>
    <button class="section-link" data-section="equipment">Equipment</button>
    <button class="section-link" data-section="gems">Gems</button>
  </aside>
  <section class="editor-body">
    <div id="panel-currency" class="panel"></div>
    <div id="panel-consumables" class="panel hidden"></div>
    <div id="panel-characters" class="panel hidden"></div>
    <div id="panel-team" class="panel hidden"></div>
    <div id="panel-equipment" class="panel hidden"></div>
    <div id="panel-gems" class="panel hidden"></div>
  </section>
</main>

<!-- ── Database (generic table browser) ─────────────────────────────────── -->
<main id="view-database" class="view hidden">
  <aside>
    <input id="filter" type="search" placeholder="Filter tables…" autocomplete="off">
    <ul id="tables"></ul>
  </aside>
  <section id="content">
    <div id="table-header">
      <h2 id="table-name">Select a table</h2>
      <div id="pager" class="pager hidden">
        <button id="prev">‹ Prev</button>
        <span id="range"></span>
        <button id="next">Next ›</button>
      </div>
    </div>
    <div id="grid-wrap"><table id="grid"></table></div>
    <p id="hint" class="hint">Raw table view. Edit any non-key cell (commit on Enter / blur), then <b>Write to save file</b>. A timestamped backup of the original is made automatically. Close the game before writing.</p>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
